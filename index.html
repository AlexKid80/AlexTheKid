<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="AXL" />
  <meta name="theme-color" content="#06080d" />
  <link rel="icon" type="image/png" href="assets/images/logo.png" />
  <title>AXL | Intro</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #06080d;
      --green: #43f58a;
      --dot-size: 10px;
      --edge-space: clamp(28px, 8vw, 160px);
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      min-height: 100svh;
      background-color: var(--bg);
      /* The original intro's navy background, lighting, and subtle grid. */
      background-image:
        radial-gradient(circle at 18% 0%, rgba(29, 167, 255, .16), transparent 25%),
        radial-gradient(circle at 82% 0%, rgba(216, 226, 234, .10), transparent 28%),
        radial-gradient(circle at 50% 100%, rgba(29, 167, 255, .08), transparent 32%),
        linear-gradient(180deg, #030509 0%, #070b12 48%, #05070c 100%);
      font-family: "Segoe UI", Arial, sans-serif;
      color: #edf3f8;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    body::before {
      opacity: .16;
      background-image:
        linear-gradient(rgba(255, 255, 255, .035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, .035) 1px, transparent 1px);
      background-size: 46px 46px;
      -webkit-mask-image: radial-gradient(circle at center, black 35%, transparent 85%);
      mask-image: radial-gradient(circle at center, black 35%, transparent 85%);
    }

    body::after {
      opacity: .20;
      background:
        linear-gradient(115deg, transparent 0%, rgba(29, 167, 255, .07) 40%, transparent 62%),
        linear-gradient(245deg, transparent 10%, rgba(216, 226, 234, .05) 48%, transparent 70%);
    }

    /* Header restored from the original intro. */
    .container {
      width: min(1080px, calc(100% - 32px));
      margin: 0 auto;
    }

    .nav-wrap {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(4, 7, 12, .78);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, .10);
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 16px;
      padding: 14px 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      letter-spacing: .35px;
      min-width: 0;
      color: inherit;
      text-decoration: none;
    }

    .brand-mark {
      width: 44px;
      height: 44px;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      flex: 0 0 auto;
      overflow: hidden;
      background: rgba(255, 255, 255, .045);
      border: 1px solid rgba(255, 255, 255, .14);
      filter: drop-shadow(0 0 16px rgba(29, 167, 255, .22));
    }

    .brand-mark img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .brand span {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1;
      color: #d8e2ea;
      text-shadow: 0 0 18px rgba(29, 167, 255, .22);
    }

    @media (max-width: 760px) {
      .nav { padding: 12px 0; }
    }

    @media (max-width: 480px) {
      .container { width: min(1080px, calc(100% - 20px)); }
      .brand { gap: 10px; }
      .brand-mark {
        width: 36px;
        height: 36px;
        border-radius: 13px;
      }
      .brand span { font-size: 14px; }
    }

    .intro {
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    .runway {
      position: absolute;
      top: 50%;
      left: var(--edge-space);
      right: var(--edge-space);
      height: var(--dot-size);
      transform: translateY(-50%);
    }

    .traveller {
      position: relative;
      width: 100%;
      height: 100%;
      will-change: transform;
    }

    .dot {
      display: block;
      position: absolute;
      left: calc(var(--dot-size) / -2);
      width: var(--dot-size);
      height: var(--dot-size);
      border-radius: 0;
      background: var(--green);
      opacity: 0;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }

    .enter-wrap {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
    }

    .enter-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(16px, 3vw, 22px);
      width: min(440px, calc(100% - 40px));
      text-align: center;
    }

    .policy-note {
      position: absolute;
      top: max(88px, calc(50% - clamp(80px, 12vh, 112px)));
      left: 50%;
      transform: translateX(-50%);
      width: min(440px, calc(100% - 40px));
      margin: 0;
      color: var(--green);
      font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
      font-size: clamp(14px, 1.4vw, 16px);
      font-weight: 400;
      line-height: 1.6;
      letter-spacing: .015em;
      text-align: center;
      overflow-wrap: break-word;
    }

    .enter-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 156px;
      min-height: 50px;
      padding: 15px 32px;
      border: 1px solid var(--green);
      border-radius: 0;
      background: rgba(6, 8, 13, .65);
      color: var(--green);
      font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
      font-size: 14px;
      font-weight: 600;
      line-height: 1;
      letter-spacing: .22em;
      text-indent: .22em;
      text-decoration: none;
      box-shadow:
        0 0 14px rgba(67, 245, 138, .18),
        0 0 32px rgba(67, 245, 138, .09),
        inset 0 0 12px rgba(67, 245, 138, .04);
      text-shadow: 0 0 10px rgba(67, 245, 138, .24);
      transition: background-color 100ms, color 100ms, box-shadow 160ms, text-shadow 160ms;
    }

    .enter-link:hover {
      background: var(--green);
      color: var(--bg);
      box-shadow:
        0 0 20px rgba(67, 245, 138, .34),
        0 0 46px rgba(67, 245, 138, .18);
      text-shadow: none;
    }

    .enter-link:focus-visible {
      outline: 2px solid var(--green);
      outline-offset: 5px;
    }

    @media (max-width: 280px) and (max-height: 360px) {
      .policy-note { font-size: 12px; }
    }

    @media (max-height: 320px) {
      .enter-wrap { padding-top: 72px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .traveller { will-change: auto; }
      .enter-link { transition: none; }
    }
  </style>
</head>
<body>
  <header class="nav-wrap">
    <div class="container nav">
      <a class="brand" href="https://alexkid.org/" target="_blank" rel="noopener">
        <div class="brand-mark" aria-hidden="true">
          <img src="assets/images/logo.png" alt="" />
        </div>
        <span>AXL</span>
      </a>
    </div>
  </header>

  <main class="intro" aria-label="AXL intro">
    <p class="sr-only" role="status" id="intro-status">Select Enter to continue.</p>
    <p class="policy-note" id="policy-note">Plz read carefully policies.</p>
    <div class="runway" id="runway" aria-hidden="true">
      <div class="traveller" id="traveller">
        <span class="dot" id="dot"></span>
      </div>
    </div>
    <!-- Visible by default so entering the site also works without JavaScript. -->
    <div class="enter-wrap" id="enter-wrap">
      <div class="enter-content">
        <a class="enter-link" href="main.html" aria-describedby="policy-note">ENTER</a>
      </div>
    </div>
  </main>

  <script>
    (() => {
      "use strict";

      // Keep index.html beside main.html in the AlexTheKid/ repo root.
      // All durations below are milliseconds. ENTER appears after about 1.83s.
      const settings = {
        startDelay: 40,
        fadeIn: 240,
        blinkDuration: 360,
        leftBlinks: 2,
        travel: 50,
        rightBlinks: 2,
        finalHold: 60
      };

      const dot = document.getElementById("dot");
      const traveller = document.getElementById("traveller");
      const runway = document.getElementById("runway");
      const enterWrap = document.getElementById("enter-wrap");
      const status = document.getElementById("intro-status");
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

      function showEnter() {
        runway.hidden = true;
        enterWrap.hidden = false;
        traveller.style.willChange = "auto";
        status.textContent = "Intro complete. Select Enter to continue.";
      }

      function blink(count) {
        return dot.animate(
          [
            { opacity: 1, offset: 0, easing: "steps(1, end)" },
            { opacity: 0, offset: .5, easing: "steps(1, end)" },
            { opacity: 1, offset: 1 }
          ],
          {
            duration: settings.blinkDuration,
            iterations: count,
            easing: "linear",
            fill: "forwards"
          }
        ).finished;
      }

      async function playIntro() {
        // Reduced-motion visitors can enter immediately, without flashing.
        if (reducedMotion.matches || typeof dot.animate !== "function") {
          showEnter();
          return;
        }

        enterWrap.hidden = true;
        status.textContent = "Intro playing.";

        await dot.animate(
          [{ opacity: 0 }, { opacity: 1 }],
          {
            delay: settings.startDelay,
            duration: settings.fadeIn,
            easing: "ease-out",
            fill: "forwards"
          }
        ).finished;

        await blink(settings.leftBlinks);

        // Percentage movement keeps both endpoints responsive on resize.
        await traveller.animate(
          [{ transform: "translateX(0)" }, { transform: "translateX(100%)" }],
          {
            duration: settings.travel,
            easing: "cubic-bezier(.7, 0, .3, 1)",
            fill: "forwards"
          }
        ).finished;

        await blink(settings.rightBlinks);
        window.setTimeout(showEnter, settings.finalHold);
      }

      playIntro().catch(showEnter);
    })();
  </script>
</body>
</html>
