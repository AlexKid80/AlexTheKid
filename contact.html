<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="Contact AXL." />
  <meta name="theme-color" content="#06080d" />
  <link rel="icon" type="image/png" href="assets/images/logo.png" />
  <title>AXL | Contact</title>

  <style>
    :root{
      --bg:#06080d;
      --bg2:#0c111a;
      --line:rgba(255,255,255,.10);
      --line-strong:rgba(255,255,255,.18);
      --text:#edf3f8;
      --muted:#9aa8b5;
      --white:#ffffff;
      --accent:#1da7ff;
      --accent-2:#8fd7ff;
      --accent-3:#d8e2ea;
      --accent-glow:rgba(29,167,255,.24);
      --silver-glow:rgba(216,226,234,.12);
      --shadow:0 18px 44px rgba(0,0,0,.42);
      --radius:28px;
    }

    *{box-sizing:border-box}

    html{scroll-behavior:smooth}

    body{
      margin:0;
      min-height:100vh;
      font-family:Inter,Segoe UI,Arial,sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 18% 0%, rgba(29,167,255,.16), transparent 25%),
        radial-gradient(circle at 82% 0%, rgba(216,226,234,.10), transparent 28%),
        radial-gradient(circle at 50% 100%, rgba(29,167,255,.08), transparent 32%),
        linear-gradient(180deg, #030509 0%, #070b12 48%, #05070c 100%);
      line-height:1.5;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }

    body:before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      opacity:.16;
      background-image:
        linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
      background-size:46px 46px;
      mask-image:radial-gradient(circle at center, black 35%, transparent 85%);
    }

    body:after{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      opacity:.20;
      background:
        linear-gradient(115deg, transparent 0%, rgba(29,167,255,.07) 40%, transparent 62%),
        linear-gradient(245deg, transparent 10%, rgba(216,226,234,.05) 48%, transparent 70%);
    }

    a{text-decoration:none;color:inherit}
    button,input,textarea{font:inherit}

    .container{
      width:min(1080px, calc(100% - 32px));
      margin:0 auto;
      position:relative;
      z-index:1;
    }

    .nav-wrap{
      position:sticky;
      top:0;
      z-index:1000;
      background:rgba(4,7,12,.78);
      backdrop-filter:blur(12px);
      border-bottom:1px solid var(--line);
    }

    .nav{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      padding:14px 0;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:0;
      font-weight:700;
      letter-spacing:.35px;
    }

    .brand-mark{
      width:44px;
      height:44px;
      border-radius:15px;
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
      flex:0 0 auto;
      overflow:hidden;
      background:rgba(255,255,255,.045);
      border:1px solid rgba(255,255,255,.14);
      filter:drop-shadow(0 0 16px rgba(29,167,255,.22));
    }

    .brand-mark img{
      width:100%;
      height:100%;
      display:block;
      object-fit:cover;
    }

    .brand span{
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      line-height:1;
      color:var(--accent-3);
      text-shadow:0 0 18px rgba(29,167,255,.22);
    }

    .nav-links{
      display:flex;
      align-items:center;
      gap:8px;
    }

    .nav-links a{
      color:var(--muted);
      font-size:14px;
      padding:9px 13px;
      border:1px solid transparent;
      border-radius:999px;
      transition:.22s ease;
    }

    .nav-links a:hover,
    .nav-links a[aria-current="page"]{
      color:var(--white);
      border-color:var(--line);
      background:rgba(255,255,255,.055);
    }

    .contact{
      padding:72px 0 0;
    }

    .contact-box{
      position:relative;
      overflow:hidden;
      border:1px solid var(--line);
      border-radius:36px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.065), rgba(255,255,255,.022)),
        rgba(255,255,255,.018);
      box-shadow:var(--shadow);
      padding:48px;
    }

    .contact-box:before{
      content:"";
      position:absolute;
      right:-80px;
      top:-70px;
      width:260px;
      height:260px;
      border-radius:50%;
      background:radial-gradient(circle, var(--accent-glow), transparent 68%);
      pointer-events:none;
    }

    .contact-box:after{
      content:"";
      position:absolute;
      left:-70px;
      bottom:-100px;
      width:260px;
      height:260px;
      border-radius:50%;
      background:radial-gradient(circle, var(--silver-glow), transparent 72%);
      pointer-events:none;
    }

    .contact-frame{
      position:absolute;
      inset:18px;
      border-radius:28px;
      border:1px solid rgba(255,255,255,.07);
      pointer-events:none;
    }

    .contact-frame:before,
    .contact-frame:after{
      content:"";
      position:absolute;
      top:28px;
      width:90px;
      height:1px;
      background:linear-gradient(90deg, transparent, rgba(29,167,255,.72), transparent);
    }

    .contact-frame:before{left:32px}
    .contact-frame:after{right:32px}

    .contact-content{
      position:relative;
      z-index:1;
      width:min(760px, 100%);
      margin:0 auto;
    }

    .eyebrow{
      display:inline-flex;
      align-items:center;
      gap:9px;
      margin:0 0 14px;
      padding:9px 13px;
      border:1px solid rgba(255,255,255,.12);
      border-radius:999px;
      color:var(--accent-2);
      background:rgba(255,255,255,.045);
      font-size:12px;
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:.14em;
      text-shadow:0 0 16px rgba(29,167,255,.25);
    }

    .eyebrow-dot{
      width:8px;
      height:8px;
      border-radius:50%;
      background:var(--accent);
      box-shadow:0 0 16px rgba(29,167,255,.75);
      flex:0 0 auto;
      animation:pulse 1.8s ease-in-out infinite;
    }

    @keyframes pulse{
      0%,100%{transform:scale(1);opacity:1}
      50%{transform:scale(1.22);opacity:.65}
    }

    h1{
      margin:0 0 18px;
      color:var(--white);
      font-size:clamp(42px, 7vw, 72px);
      line-height:.96;
      letter-spacing:-.065em;
    }

    .accent{
      color:var(--accent-2);
      text-shadow:0 0 24px rgba(29,167,255,.22);
    }

    .contact-lead{
      max-width:650px;
      margin:0;
      color:var(--muted);
      font-size:clamp(16px, 2vw, 18px);
    }

    .contact-form{
      margin-top:30px;
      display:grid;
      gap:18px;
    }

    .field-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:16px;
    }

    .field,
    .rating-wrap{
      display:grid;
      gap:8px;
    }

    .field label,
    .rating-label{
      color:var(--white);
      font-size:14px;
      font-weight:700;
      letter-spacing:.02em;
    }

    .input,
    .textarea{
      width:100%;
      border:1px solid var(--line);
      border-radius:16px;
      background:rgba(255,255,255,.04);
      color:var(--white);
      padding:14px 16px;
      outline:none;
      transition:.22s ease;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.03);
    }

    .input::placeholder,
    .textarea::placeholder{color:#7f8b94}

    .input:focus,
    .textarea:focus{
      border-color:rgba(29,167,255,.48);
      box-shadow:0 0 0 1px rgba(29,167,255,.10), 0 0 20px rgba(29,167,255,.10);
      background:rgba(255,255,255,.055);
    }

    .textarea{
      min-height:170px;
      resize:vertical;
    }

    .rating{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .rating input{
      position:absolute;
      width:1px;
      height:1px;
      opacity:0;
      pointer-events:none;
    }

    .rating label{
      min-width:48px;
      height:48px;
      padding:0 12px;
      border-radius:14px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.04);
      color:var(--muted);
      display:inline-flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      transition:.22s ease;
      user-select:none;
      font-size:20px;
      line-height:1;
    }

    .rating label:hover{
      transform:translateY(-1px);
      border-color:rgba(29,167,255,.38);
      color:var(--white);
      background:rgba(29,167,255,.10);
    }

    .rating input:focus-visible + label{
      outline:2px solid var(--accent-2);
      outline-offset:3px;
    }

    .rating input:checked + label{
      background:rgba(29,167,255,.16);
      border-color:rgba(29,167,255,.52);
      color:var(--white);
      box-shadow:0 0 0 1px rgba(29,167,255,.08), 0 0 20px rgba(29,167,255,.12);
    }

    .form-actions{
      display:flex;
      align-items:center;
      gap:14px;
      flex-wrap:wrap;
    }

    .btn{
      min-height:52px;
      padding:0 22px;
      border:1px solid rgba(29,167,255,.38);
      border-radius:16px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      color:#06101a;
      background:linear-gradient(135deg, var(--accent-2), var(--accent-3));
      font-weight:800;
      box-shadow:0 14px 34px rgba(29,167,255,.12);
      transition:.22s ease;
    }

    .btn:hover{
      transform:translateY(-1px);
      box-shadow:0 18px 38px rgba(29,167,255,.18), 0 0 24px rgba(29,167,255,.10);
    }

    .btn:focus-visible{
      outline:2px solid var(--white);
      outline-offset:3px;
    }

    .helper{
      color:var(--muted);
      font-size:13px;
    }

    footer{
      padding:24px 0 34px;
      margin-top:72px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      flex-wrap:wrap;
      font-size:12px;
      color:#7f8c97;
    }

    .footer-copy{
      font-family:Georgia,"Times New Roman",serif;
      font-style:italic;
      font-weight:600;
      font-size:17px;
      line-height:1;
      letter-spacing:.5px;
      color:#8d9aa5;
    }

    .reveal{
      opacity:0;
      transform:translateY(18px);
      transition:opacity .75s ease, transform .75s ease;
    }

    .reveal.show{
      opacity:1;
      transform:translateY(0);
    }

    @media (max-width: 760px){
      .nav{
        align-items:flex-start;
        flex-direction:column;
        padding:12px 0;
      }

      .nav-links{
        width:100%;
        overflow-x:auto;
        padding-bottom:3px;
      }

      .contact{padding:54px 0 0}

      .contact-box{
        padding:34px 18px 28px;
        border-radius:28px;
      }

      .contact-frame{
        inset:12px;
        border-radius:22px;
      }

      .field-grid{grid-template-columns:1fr}

      footer{
        justify-content:center;
        text-align:center;
        padding-top:22px;
        margin-top:54px;
      }

      .footer-copy{width:100%}
    }

    @media (max-width: 480px){
      .container{width:min(1080px, calc(100% - 20px))}

      .brand{gap:10px}

      .brand-mark{
        width:36px;
        height:36px;
        border-radius:13px;
      }

      .brand span{font-size:14px}

      .nav-links a{
        font-size:13px;
        padding:8px 11px;
      }

      .contact-box{
        padding:28px 16px 22px;
        border-radius:24px;
      }

      h1{font-size:clamp(38px, 14vw, 54px)}

      .contact-lead{font-size:15px}

      .rating{gap:8px}

      .rating label{
        min-width:42px;
        height:42px;
        padding:0 10px;
        font-size:18px;
      }

      .form-actions{
        flex-direction:column;
        align-items:stretch;
      }

      .btn{width:100%}

      .footer-copy{font-size:16px}
    }

    @media (prefers-reduced-motion: reduce){
      html{scroll-behavior:auto}

      .eyebrow-dot{animation:none}

      .nav-links a,
      .rating label,
      .btn,
      .reveal,
      .reveal.show{
        transition:none;
        transform:none;
      }
    }
  </style>
</head>
<body>

  <div class="nav-wrap">
    <div class="container nav">
      <a class="brand" href="https://alexkid.org/" target="_blank" rel="noopener">
        <div class="brand-mark" aria-hidden="true">
          <img src="logo.png" alt="" />
        </div>
        <span>AXL</span>
      </a>

      <nav class="nav-links" aria-label="Main navigation">
        <a href="main.html" aria-current="page">Home</a>
      </nav>
    </div>
  </div>

  <main>
    <section class="contact">
      <div class="container">
        <div class="contact-box reveal">
          <div class="contact-frame" aria-hidden="true"></div>

          <div class="contact-content">
            <p class="eyebrow">
              <span class="eyebrow-dot" aria-hidden="true"></span>
              Contact &amp; Feedback
            </p>

            <h1>Cont<span class="accent">A</span>ct</h1>

            <p class="contact-lead">
              Speak it Out.
            </p>

            <form class="contact-form" id="contactForm">
              <div class="field-grid">
                <div class="field">
                  <label for="name">Name</label>
                  <input
                    class="input"
                    id="name"
                    name="Name"
                    type="text"
                    placeholder="Your name"
                    autocomplete="name"
                    required
                  />
                </div>

                <div class="field">
                  <label for="email">Email</label>
                  <input
                    class="input"
                    id="email"
                    name="Email"
                    type="email"
                    placeholder="your@email.com"
                    autocomplete="email"
                    required
                  />
                </div>
              </div>

              <fieldset class="rating-wrap" style="border:0;padding:0;margin:0">
                <legend class="rating-label">Rating</legend>
                <div class="rating">
                  <input type="radio" id="star1" name="Rating" value="1/5" required />
                  <label for="star1" aria-label="1 star">★</label>

                  <input type="radio" id="star2" name="Rating" value="2/5" />
                  <label for="star2" aria-label="2 stars">★</label>

                  <input type="radio" id="star3" name="Rating" value="3/5" />
                  <label for="star3" aria-label="3 stars">★</label>

                  <input type="radio" id="star4" name="Rating" value="4/5" />
                  <label for="star4" aria-label="4 stars">★</label>

                  <input type="radio" id="star5" name="Rating" value="5/5" />
                  <label for="star5" aria-label="5 stars">★</label>
                </div>
              </fieldset>

              <div class="field">
                <label for="message">Message</label>
                <textarea
                  class="textarea"
                  id="message"
                  name="Message"
                  placeholder="Write your message here..."
                  required
                ></textarea>
              </div>

              <div class="form-actions">
                <button class="btn" type="submit">Send Message</button>
                <div class="helper">Opens your Email app.</div>
              </div>
            </form>
          </div>
        </div>

        <footer>
          <span class="footer-copy">© <span id="year"></span></span>
          <span>Contact Form</span>
        </footer>
      </div>
    </section>
  </main>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();

    (function () {
      var items = document.querySelectorAll(".reveal");

      if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches && "IntersectionObserver" in window) {
        var observer = new IntersectionObserver(function (entries) {
          for (var i = 0; i < entries.length; i++) {
            if (entries[i].isIntersecting) {
              entries[i].target.classList.add("show");
              observer.unobserve(entries[i].target);
            }
          }
        }, { threshold: 0.12 });

        for (var j = 0; j < items.length; j++) {
          observer.observe(items[j]);
        }
      } else {
        for (var k = 0; k < items.length; k++) {
          items[k].classList.add("show");
        }
      }

      var form = document.getElementById("contactForm");

      form.addEventListener("submit", function (event) {
        event.preventDefault();

        if (!form.checkValidity()) {
          form.reportValidity();
          return;
        }

        var name = document.getElementById("name").value.trim();
        var email = document.getElementById("email").value.trim();
        var rating = form.querySelector('input[name="Rating"]:checked');
        var message = document.getElementById("message").value.trim();
        var subject = name + " claim";
        var body =
          "Name: " + name + "\n" +
          "Email: " + email + "\n" +
          "Rating: " + rating.value + "\n\n" +
          "Message:\n" + message;
        var mailto =
          "mailto:axl@alexkid.org" +
          "?subject=" + encodeURIComponent(subject) +
          "&body=" + encodeURIComponent(body);

        window.location.href = mailto;
      });
    })();
  </script>
</body>
</html>
